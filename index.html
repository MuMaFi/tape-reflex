<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tape-reflex.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-edge: #000000;
    --cream: #000000;
    --cream-dim: #000000;
    --rust: #000000;
    --led-off: #ffffff;
    --shadow: rgba(0,0,0,.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color:var(--cream);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .grain{ display:none; }

  /* ---------- Brand ---------- */
  header.brand{
    max-width:920px; margin:0 auto 30px; text-align:center;
  }
  header.brand h1{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:clamp(24px,5vw,36px);
    letter-spacing:1px;
    margin:0;
    color:var(--cream);
    text-transform:lowercase;
  }
  header.brand h1 span{ color:var(--rust); }
  header.brand p{
    margin:6px 0 0;
    color:var(--cream-dim);
    font-size:12px;
    letter-spacing:.5px;
    font-weight:400;
  }

  /* ---------- Transport ---------- */
  .transport{
    width:fit-content; max-width:100%; margin:0 auto 34px;
    background:#ffffff;
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:14px 18px;
    display:flex; flex-wrap:wrap; gap:18px; align-items:center;
    position:relative; z-index:2;
  }
  .transport-controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }  .btn{
    font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:.5px; font-size:11px;
    text-transform:uppercase; color:var(--cream); background:#ffffff;
    border:1px solid #000; border-radius:8px;
    height:40px; padding:0 14px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    transition:transform .08s ease, background .15s ease;
    box-sizing:border-box;
  }
  .btn:hover{ background:#f0f0f0; }
  .btn:active{ transform:translateY(1px); }
  .btn.active{
    background:#000000; color:#ffffff; border-color:#000000;
  }
  .btn.icon{ width:40px; padding:0; font-size:15px; }
  .stop-icon{
    display:inline-block; width:12px; height:12px; position:relative;
  }
  .stop-icon::before, .stop-icon::after{
    content:''; position:absolute; top:0; width:3px; height:12px; background:#000000;
  }
  .stop-icon::before{ left:1px; }
  .stop-icon::after{ right:1px; }
  .btn.icon.active .stop-icon::before, .btn.icon.active .stop-icon::after{ background:#ffffff; }
  .btn.small{ height:40px; padding:0 10px; font-size:11px; }
  input[type=file]{ display:none; }

  .scope{
    width:100px; height:40px; border-radius:6px;
    background:#ffffff; border:1px solid #000;
  }

  .master{ display:flex; flex-direction:row; align-items:center; gap:6px; }
  .master label{ font-size:10px; letter-spacing:1px; color:var(--cream-dim); }
  .master .knob{ width:40px; height:40px; }
  .master .knob-dial{ width:40px; height:40px; }

  .export-bar{
    display:block; margin:0 auto 34px;
    background:#ffffff; color:var(--cream);
    border:1px solid #000; border-radius:14px;
    padding:14px 18px;
    font-family:'IBM Plex Mono',monospace; font-weight:500; letter-spacing:.5px; font-size:11px;
    text-transform:uppercase; text-align:center;
    cursor:pointer; box-sizing:border-box;
    transition:transform .08s ease, background .15s ease;
  }
  .export-bar:hover{ background:#f0f0f0; }
  .export-bar:active{ transform:translateY(1px); }
  .export-bar:disabled{ opacity:.5; cursor:default; }

  /* ---------- Vibes / Generate ---------- */
  .vibes-panel{
    margin:0 auto 30px;
    background:#ffffff;
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:18px 20px 20px;
    position:relative; z-index:2;
    box-sizing:border-box;
  }
  .vibes-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .vibes-label{ font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--cream-dim); }
  .expert-toggle{ display:none !important; }
  .expert-text{ font-size:12px; letter-spacing:.5px; color:var(--cream-dim); text-transform:uppercase; }

  .macros{ display:flex; flex-direction:column; gap:14px; margin-bottom:16px; }
  .macro-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .macro-label{ min-width:140px; }
  .macro-label .name{ font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cream); display:block; }
  .macro-label .desc{ font-size:10.5px; color:var(--cream-dim); }
  .segmented{ display:flex; background:#ffffff; border:1px solid #000; border-radius:9px; overflow:hidden; }
  .segmented button{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.4px; text-transform:uppercase;
    color:var(--cream-dim); background:transparent; border:none; border-right:1px solid #000;
    padding:9px 12px; cursor:pointer; transition:all .15s ease;
  }
  .segmented button:last-child{ border-right:none; }
  .segmented button:hover{ color:var(--cream); }
  .segmented button.active{ background:#000000; color:#ffffff; font-weight:500; }

  .btn.generate{
    background:#000000; color:#ffffff; font-weight:600;
    border:1px solid #000000;
  }
  .btn.generate:hover{ filter:brightness(1.15); }
  .vibes-hint{ margin:12px 0 0; font-size:11.5px; color:var(--cream-dim); line-height:1.5; }

  .board-wrap{ display:none; max-width:1100px; margin:0 auto; position:relative; z-index:2; }
  .board-wrap.open{ display:block; }

  .board{
    background:#ffffff;
    border:1px solid #000;
    border-radius:16px;
    padding:34px 22px 26px;
    display:flex; gap:16px; overflow-x:auto;
    position:relative;
  }
  .rivet{
    position:absolute; width:8px; height:8px; border-radius:50%;
    background:#000000;
  }
  .rivet.tl{top:10px;left:10px;} .rivet.tr{top:10px;right:10px;}
  .rivet.bl{bottom:10px;left:10px;} .rivet.br{bottom:10px;right:10px;}

  svg.cables{ position:absolute; inset:0; pointer-events:none; width:100%; height:100%; }
  svg.cables path{ fill:none; stroke:#000000; stroke-width:3; stroke-linecap:round; }
  svg.cables path.hl{ stroke:#000000; }

  .pedal{
    flex:0 0 132px;
    background:#ffffff;
    border-radius:10px;
    border:1px solid #000;
    padding:12px 10px 14px;
    position:relative;
    touch-action:none;
    user-select:none;
    transition:opacity .15s ease, transform .05s ease;
  }
  .pedal.dragging{ opacity:.55; z-index:20; }
  .pedal .grip{
    height:14px; border-radius:4px; margin:0 auto 10px;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 2px, transparent 2px 5px);
    cursor:grab; opacity:.8;
  }
  .pedal .idx{
    position:absolute; top:10px; right:10px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:rgba(0,0,0,.45);
  }
  .pedal .name{
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; letter-spacing:1px;
    text-align:center; color:#000000; text-transform:uppercase; margin:2px 0 12px;
  }
  .pedal .note{
    text-align:center; font-size:9.5px; color:rgba(0,0,0,.5); margin-top:6px; letter-spacing:.3px;
  }

  .knobs{ display:flex; justify-content:center; gap:14px; margin-bottom:10px; min-height:70px; }
  .knob{ display:flex; flex-direction:column; align-items:center; gap:5px; touch-action:none; cursor:ns-resize; }
  .knob-dial{
    width:40px; height:40px; border-radius:50%;
    background:#ffffff;
    border:2px solid #000000;
    position:relative;
  }
  .knob-dial .ind{
    position:absolute; top:3px; left:50%; width:2px; height:14px; background:#000000;
    transform-origin:50% 17px; border-radius:1px;
  }
  .knob label{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; letter-spacing:.5px; color:rgba(0,0,0,.55); }
  .knob .val{ font-family:'IBM Plex Mono',monospace; font-size:8.5px; color:rgba(0,0,0,.4); }

  .footswitch{
    width:46px; height:46px; border-radius:50%; margin:4px auto 0; display:block;
    background:#ffffff;
    border:3px solid #000000;
    cursor:pointer; position:relative;
  }
  .footswitch:active{ transform:translateY(1px); }
  .footswitch .led{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    width:8px; height:8px; border-radius:50%; background:var(--led-off);
    border:1px solid #000;
    transition: background .1s;
  }
  .pedal.on .footswitch .led{ background:#000000; }

  .jack{ width:9px; height:9px; border-radius:50%; background:#ffffff; border:1px solid #000; margin:8px auto 0; }

  footer{ max-width:920px; margin:26px auto 0; color:#000000; font-size:11.5px; line-height:1.6; text-align:center; }
  footer b{ color:#000000; }

  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }

  /* ---------- Intro overlay ---------- */
  #introOverlay{
    position:fixed; inset:0; z-index:1000;
    background:#ffffff;
    display:flex; align-items:center; justify-content:center;
    opacity:1;
    transition:opacity 1.1s ease;
  }
  #introOverlay.hide{ opacity:0; pointer-events:none; }
  #introVideo{
    width:min(70vw,420px); height:min(70vw,420px);
    object-fit:contain;
  }
  #pageContent{
    opacity:0;
    transition:opacity 1.4s ease;
  }
  #pageContent.show{ opacity:1; }
</style>
</head>

      <span class="switch"><span class="knob-slide"></span></span>
      <span class="expert-text">Expert Mode</span>
    </label>
  </div>
  <div class="macros" id="macros"></div>
  <button class="btn generate" id="btnGenerate">Generate</button>
  <p class="vibes-hint" id="vibesHint" style="display:none;"></p>
</section>

<div class="board-wrap" id="boardWrap">
  <div class="board" id="board">
    <svg class="cables" id="cables"></svg>
  </div>
</div>

<button class="export-bar" id="btnExport">Export</button>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Pedal definitions: id, display name, accent colors, params
  // ---------------------------------------------------------------
  const PEDAL_DEFS = [
    { id:'sat',   name:'Saturate', desc:'',        light:'#ffffff', dark:'#ffffff', bypassMode:'swap' },
    { id:'res',   name:'Crush', desc:'',   light:'#ffffff', dark:'#ffffff', bypassMode:'swap' },
    { id:'tape',  name:'Tape',     desc:'', light:'#ffffff', dark:'#ffffff', bypassMode:'swap' },
    { id:'cho',   name:'Chorus',   desc:'',  light:'#ffffff', dark:'#ffffff', bypassMode:'add'  },
    { id:'trem',  name:'Tremolo',  desc:'',     light:'#ffffff', dark:'#ffffff', bypassMode:'add'  },
    { id:'rev',   name:'Reverse',  desc:'', light:'#ffffff', dark:'#ffffff', bypassMode:'special' },
    { id:'del',   name:'Delay',    desc:'',                     light:'#ffffff', dark:'#ffffff', bypassMode:'add'  },
    { id:'verb',  name:'Reverb',   desc:'',                 light:'#ffffff', dark:'#ffffff', bypassMode:'add'  },
  ];

  let order = PEDAL_DEFS.map(p=>p.id); // current chain order
  const pedals = {}; // id -> {def, nodes, enabled, elements...}

  // ---------------------------------------------------------------
  // Macros: each groups 2 pedals under one "how do you want your X"
  // dial. Every level defines an on-probability + a value range per
  // knob; Generate rolls a fresh number inside that range each time.
  // ---------------------------------------------------------------
  const LEVELS = ['aus','sanft','mittel','extrem'];
  const LEVEL_LABEL = { aus:'Off', sanft:'Soft', mittel:'Medium', extrem:'Extreme' };

  const MACROS = {
    waerme: { name:'Warmth', desc:'Saturation & Tape Character', pedals:['sat','tape'],
      levels:{
        aus:    { sat:{on:0}, tape:{on:0} },
        sanft:  { sat:{on:.5, drive:[10,25]}, tape:{on:.6, age:[10,25], wobble:[5,15]} },
        mittel: { sat:{on:.85, drive:[25,45]}, tape:{on:.85, age:[25,50], wobble:[15,30]} },
        extrem: { sat:{on:.95, drive:[45,80]}, tape:{on:.95, age:[55,90], wobble:[30,55]} }
      }},
    schwung: { name:'Motion', desc:'Chorus & Tremolo Movement', pedals:['cho','trem'],
      levels:{
        aus:    { cho:{on:0}, trem:{on:0} },
        sanft:  { cho:{on:.5, rate:[10,25], depth:[10,25]}, trem:{on:.3, rate:[10,20], depth:[10,20]} },
        mittel: { cho:{on:.8, rate:[20,40], depth:[25,45]}, trem:{on:.55, rate:[15,35], depth:[20,40]} },
        extrem: { cho:{on:.9, rate:[35,60], depth:[45,75]}, trem:{on:.8, rate:[30,70], depth:[40,70]} }
      }},
    raum: { name:'Space', desc:'Delay & Reverb Depth', pedals:['del','verb'],
      levels:{
        aus:    { del:{on:0}, verb:{on:0} },
        sanft:  { del:{on:.4, time:[10,25], fb:[10,20]}, verb:{on:.5, size:[10,25], mix:[10,25]} },
        mittel: { del:{on:.7, time:[25,50], fb:[20,40]}, verb:{on:.8, size:[30,55], mix:[25,45]} },
        extrem: { del:{on:.85, time:[50,90], fb:[40,70]}, verb:{on:.95, size:[55,95], mix:[45,80]} }
      }},
    bruch: { name:'Break', desc:'Resample & Reverse Randomness', pedals:['res','rev'],
      levels:{
        aus:    { res:{on:0}, rev:{on:0} },
        sanft:  { res:{on:.3, rate:[2,6], depth:[10,16]}, rev:{on:.05} },
        mittel: { res:{on:.6, rate:[5,12], depth:[6,10]}, rev:{on:.2} },
        extrem: { res:{on:.9, rate:[10,24], depth:[2,6]}, rev:{on:.4} }
      }}
  };
  // The MACROS data remains the source for value ranges per level,
  // but is no longer displayed grouped — each pedal gets its own
  // level selection (see PEDAL_SPECS below).

  // ---------------------------------------------------------------
  // Per-pedal strength: one level (Off/Soft/Medium/Extreme) per effect.
  // Clicking a level ONLY sets the selection (like the macros before) —
  // it's applied only when "Generate" is pressed, which then rolls a
  // random number within the chosen level per pedal
  // (incl. on/off probability).
  // ---------------------------------------------------------------
  const PEDAL_SPECS = {};
  Object.values(MACROS).forEach(m=>{
    m.pedals.forEach(pedId=>{
      PEDAL_SPECS[pedId] = {};
      LEVELS.forEach(lv=>{ PEDAL_SPECS[pedId][lv] = m.levels[lv][pedId]; });
    });
  });
  const pedalState = {};
  const DEFAULT_LEVEL = { sat:'aus', res:'sanft', tape:'sanft', cho:'mittel', trem:'sanft', rev:'aus', del:'mittel', verb:'extrem' };
  PEDAL_DEFS.forEach(d=>{ pedalState[d.id] = DEFAULT_LEVEL[d.id] || 'mittel'; });

  let ctx = null;
  let masterGain, analyser, scopeCtx;
  let sourceNode = null;
  let sourceKind = null; // 'buffer'
  let currentBuffer = null;
  let reversedFlag = false;
  let animId = null;

  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext||window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.85;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      masterGain.connect(analyser);
      analyser.connect(ctx.destination);
      buildPedals();
      rebuildRouting();
      startScope();
      renderBoard();
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // ---------------------------------------------------------------
  // Pedal DSP builders
  // ---------------------------------------------------------------
  function makeShell(){
    const input = ctx.createGain();
    const output = ctx.createGain();
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    input.connect(dry); dry.connect(output);
    return {input, output, dry, wet};
  }

  function buildSaturate(){
    const s = makeShell();
    const shaper = ctx.createWaveShaper();
    shaper.oversample = '4x';
    function setDrive(v){
      const k = (v/100)*40 + 1;
      const n = 2048; const curve = new Float32Array(n);
      for(let i=0;i<n;i++){ const x = i*2/n - 1; curve[i] = Math.tanh(k*x)/Math.tanh(k); }
      shaper.curve = curve;
    }
    setDrive(35);
    s.input.connect(shaper); shaper.connect(s.wet); s.wet.connect(s.output);
    return {shell:s, params:[{key:'drive',label:'DRIVE',min:0,max:100,def:35,onChange:setDrive}]};
  }

  function buildResample(){
    const s = makeShell();
    const bufSize = 2048;
    const node = ctx.createScriptProcessor(bufSize,2,2);
    let step = 5, bits = 7, phase = 0, holdL=0, holdR=0;
    node.onaudioprocess = (e)=>{
      const inL = e.inputBuffer.getChannelData(0);
      const inR = e.inputBuffer.numberOfChannels>1? e.inputBuffer.getChannelData(1): inL;
      const outL = e.outputBuffer.getChannelData(0);
      const outR = e.outputBuffer.numberOfChannels>1? e.outputBuffer.getChannelData(1): outL;
      const levels = Math.pow(2, bits);
      for(let i=0;i<inL.length;i++){
        if(phase % step === 0){ holdL = inL[i]; holdR = inR[i]; }
        phase++;
        outL[i] = Math.round(holdL*levels)/levels;
        outR[i] = Math.round(holdR*levels)/levels;
      }
    };
    s.input.connect(node); node.connect(s.wet); s.wet.connect(s.output);
    return {shell:s, keepAlive:node, params:[
      {key:'rate',label:'RATE',min:1,max:24,def:5,onChange:v=>step=Math.max(1,Math.round(v))},
      {key:'depth',label:'DEPTH',min:1,max:16,def:7,onChange:v=>bits=Math.max(1,Math.round(v))}
    ]};
  }

  function buildTape(){
    const s = makeShell();
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200;
    const wobble = ctx.createDelay(0.05); wobble.delayTime.value = 0.006;
    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=1.1;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.0015;
    lfo.connect(lfoGain); lfoGain.connect(wobble.delayTime); lfo.start();

    // hiss
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*0.6;
    const noise = ctx.createBufferSource(); noise.buffer=noiseBuf; noise.loop=true;
    const noiseGain = ctx.createGain(); noiseGain.gain.value = 0.006;
    noise.connect(noiseGain);
    noise.start();

    s.input.connect(lp); lp.connect(wobble); wobble.connect(s.wet);
    noiseGain.connect(s.wet);
    s.wet.connect(s.output);

    function setAge(v){ // 0-100: higher = darker + hissier
      lp.frequency.setTargetAtTime(6500 - (v/100)*4800, ctx.currentTime, 0.05);
      noiseGain.gain.setTargetAtTime(0.001 + (v/100)*0.02, ctx.currentTime, 0.05);
    }
    function setWobble(v){
      lfoGain.gain.setTargetAtTime(0.0003 + (v/100)*0.004, ctx.currentTime, 0.05);
      lfo.frequency.setTargetAtTime(0.4 + (v/100)*2.6, ctx.currentTime, 0.05);
    }
    setAge(40); setWobble(30);
    return {shell:s, params:[
      {key:'age',label:'AGE',min:0,max:100,def:40,onChange:setAge},
      {key:'wobble',label:'WOBBLE',min:0,max:100,def:30,onChange:setWobble}
    ]};
  }

  function buildChorus(){
    const s = makeShell();
    const delay = ctx.createDelay(0.05); delay.delayTime.value=0.008;
    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.9;
    const lfoGain = ctx.createGain(); lfoGain.gain.value=0.003;
    lfo.connect(lfoGain); lfoGain.connect(delay.delayTime); lfo.start();
    const fb = ctx.createGain(); fb.gain.value=0.12;
    delay.connect(fb); fb.connect(delay);
    s.input.connect(delay); delay.connect(s.wet); s.wet.connect(s.output);
    function setRate(v){ lfo.frequency.setTargetAtTime(0.1 + (v/100)*4, ctx.currentTime, 0.05); }
    function setDepth(v){ lfoGain.gain.setTargetAtTime(0.0005 + (v/100)*0.008, ctx.currentTime, 0.05); }
    setRate(30); setDepth(45);
    return {shell:s, params:[
      {key:'rate',label:'RATE',min:0,max:100,def:30,onChange:setRate},
      {key:'depth',label:'DEPTH',min:0,max:100,def:45,onChange:setDepth}
    ]};
  }

  function buildTremolo(){
    const s = makeShell();
    const ampGain = ctx.createGain(); ampGain.gain.value=0;
    const lfo = ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=5;
    const depthGain = ctx.createGain(); depthGain.gain.value=0.4;
    const offset = ctx.createConstantSource(); offset.offset.value=0.6;
    lfo.connect(depthGain); depthGain.connect(ampGain.gain);
    offset.connect(ampGain.gain);
    lfo.start(); offset.start();
    s.input.connect(ampGain); ampGain.connect(s.wet); s.wet.connect(s.output);
    function setRate(v){ lfo.frequency.setTargetAtTime(1 + (v/100)*11, ctx.currentTime, 0.05); }
    function setDepth(v){
      const d = (v/100)*0.5;
      depthGain.gain.setTargetAtTime(d, ctx.currentTime, 0.05);
      offset.offset.setTargetAtTime(1-d, ctx.currentTime, 0.05);
    }
    setRate(40); setDepth(55);
    return {shell:s, params:[
      {key:'rate',label:'RATE',min:0,max:100,def:40,onChange:setRate},
      {key:'depth',label:'DEPTH',min:0,max:100,def:55,onChange:setDepth}
    ]};
  }

  function buildReverse(){
    const s = makeShell(); // pure passthrough, no dsp
    s.input.connect(s.wet); s.wet.connect(s.output); // wet == dry effectively, wet gain unused actively
    s.wet.gain.value = 0;
    return {shell:s, params:[], isReverse:true};
  }

  function buildDelay(){
    const s = makeShell();
    const d = ctx.createDelay(1.5); d.delayTime.value=0.35;
    const fb = ctx.createGain(); fb.gain.value=0.35;
    d.connect(fb); fb.connect(d);
    s.input.connect(d); d.connect(s.wet); s.wet.connect(s.output);
    function setTime(v){ d.delayTime.setTargetAtTime(0.05 + (v/100)*0.95, ctx.currentTime, 0.02); }
    function setFeedback(v){ fb.gain.setTargetAtTime((v/100)*0.8, ctx.currentTime, 0.02); }
    setTime(35); setFeedback(35);
    return {shell:s, params:[
      {key:'time',label:'TIME',min:0,max:100,def:35,onChange:setTime},
      {key:'fb',label:'FEEDBACK',min:0,max:100,def:35,onChange:setFeedback}
    ]};
  }

  function buildReverb(){
    const s = makeShell();
    const convolver = ctx.createConvolver();
    const mixGain = ctx.createGain(); mixGain.gain.value=0.5;
    function buildIR(seconds, decay){
      const len = Math.max(1, Math.floor(ctx.sampleRate*seconds));
      const irBuf = ctx.createBuffer(2, len, ctx.sampleRate);
      for(let ch=0; ch<2; ch++){
        const d = irBuf.getChannelData(ch);
        for(let i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay); }
      }
      convolver.buffer = irBuf;
    }
    buildIR(2.2, 3);
    s.input.connect(convolver); convolver.connect(mixGain); mixGain.connect(s.wet); s.wet.connect(s.output);
    let sizeTimer=null;
    function setSize(v){
      clearTimeout(sizeTimer);
      sizeTimer = setTimeout(()=>buildIR(0.5 + (v/100)*3.5, 3), 180);
    }
    function setSizeImmediate(v){
      clearTimeout(sizeTimer);
      buildIR(0.5 + (v/100)*3.5, 3);
    }
    function setMix(v){ mixGain.gain.setTargetAtTime(v/100, ctx.currentTime, 0.03); }
    setSizeImmediate(50); setMix(50);
    return {shell:s, params:[
      {key:'size',label:'SIZE',min:0,max:100,def:50,onChange:setSize,onChangeImmediate:setSizeImmediate},
      {key:'mix',label:'MIX',min:0,max:100,def:50,onChange:setMix}
    ]};
  }

  const BUILDERS = { sat:buildSaturate, res:buildResample, tape:buildTape, cho:buildChorus, trem:buildTremolo, rev:buildReverse, del:buildDelay, verb:buildReverb };

  function buildPedals(){
    PEDAL_DEFS.forEach(def=>{
      const built = BUILDERS[def.id]();
      pedals[def.id] = {
        def, shell: built.shell, params: built.params, keepAlive: built.keepAlive,
        enabled: false, // all pedals start OFF (clean signal) until "Generate" is pressed
        isReverse: !!built.isReverse
      };
      setEnabled(def.id, pedals[def.id].enabled, true);
    });
  }

  function setEnabled(id, on, silent){
    const p = pedals[id];
    p.enabled = on;
    if(p.isReverse){
      reversedFlag = on;
      if(sourceKind==='buffer') restartBufferSource();
    } else if(p.def.bypassMode === 'swap'){
      p.shell.dry.gain.value = on?0:1;
      p.shell.wet.gain.value = on?1:0;
    } else { // additive
      p.shell.dry.gain.value = 1;
      p.shell.wet.gain.value = on?1:0;
    }
    if(!silent){
      const el = p.el;
      if(el) el.classList.toggle('on', on);
    }
  }

  // ---------------------------------------------------------------
  // Routing: connect chain in current `order`
  // ---------------------------------------------------------------
  function rebuildRouting(){
    // disconnect all pedal outputs first
    order.forEach(id=>{ try{ pedals[id].shell.output.disconnect(); }catch(e){} });
    let prevOutput = null;
    order.forEach((id, i)=>{
      const p = pedals[id];
      if(i===0){
        // input side connected dynamically by source
      } else {
        pedals[order[i-1]].shell.output.connect(p.shell.input);
      }
    });
    pedals[order[order.length-1]].shell.output.connect(masterGain);
    reconnectSource();
  }

  function firstPedalInput(){ return pedals[order[0]].shell.input; }

  function reconnectSource(){
    if(!sourceNode) return;
    try{ sourceNode.disconnect(); }catch(e){}
    sourceNode.connect(firstPedalInput());
  }

  // ---------------------------------------------------------------
  // Source: demo riff / file
  // ---------------------------------------------------------------
  function stopSource(){
    if(sourceNode){
      try{ sourceNode.stop && sourceNode.stop(); }catch(e){}
      try{ sourceNode.disconnect(); }catch(e){}
      sourceNode = null;
    }
    sourceKind = null;
    setTransportState(null);
  }

  function reverseBuffer(buf){
    const rb = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for(let ch=0; ch<buf.numberOfChannels; ch++){
      const src = buf.getChannelData(ch);
      const dst = rb.getChannelData(ch);
      for(let i=0;i<src.length;i++) dst[i] = src[src.length-1-i];
    }
    return rb;
  }

  function restartBufferSource(){
    if(!currentBuffer) return;
    if(sourceNode){ try{sourceNode.stop();}catch(e){} try{sourceNode.disconnect();}catch(e){} }
    const buf = reversedFlag ? reverseBuffer(currentBuffer) : currentBuffer;
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.connect(firstPedalInput());
    src.start();
    sourceNode = src; sourceKind='buffer';
  }

  function playDemoRiff(){
    ensureCtx();
    // synthesize a short plucky bass riff offline, then loop it
    const dur = 2.4;
    const off = new OfflineAudioContext(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
    const notes = [55, 55, 82.4, 73.4, 55, 65.4, 55, 98];
    const step = dur/notes.length;
    notes.forEach((freq,i)=>{
      const t0 = i*step;
      const osc = off.createOscillator(); osc.type='sawtooth'; osc.frequency.value=freq;
      const sub = off.createOscillator(); sub.type='sine'; sub.frequency.value=freq/2;
      const env = off.createGain(); env.gain.setValueAtTime(0,t0);
      env.gain.linearRampToValueAtTime(0.5, t0+0.01);
      env.gain.exponentialRampToValueAtTime(0.001, t0+step*0.9);
      const filt = off.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1200;
      osc.connect(filt); sub.connect(filt); filt.connect(env); env.connect(off.destination);
      osc.start(t0); osc.stop(t0+step); sub.start(t0); sub.stop(t0+step);
    });
    off.startRendering().then(rendered=>{
      stopSource();
      currentBuffer = rendered;
      restartBufferSource();
      setTransportState('demo');
    });
  }

  function loadFile(file){
    ensureCtx();
    const label = document.querySelector('label[for="fileInput"]');
    const oldLabel = label ? label.textContent : null;
    if(label) label.textContent = 'Loading…';
    const reader = new FileReader();
    reader.onload = ()=>{
      ctx.decodeAudioData(reader.result.slice(0)).then(buf=>{
        stopSource();
        currentBuffer = buf;
        setTransportState(null); // loaded, but not started yet — press Play
        if(label) label.textContent = file.name.length > 18 ? file.name.slice(0,15)+'…' : file.name;
      }).catch(()=>{
        alert('Could not decode audio file.');
        if(label) label.textContent = oldLabel;
      });
    };
    reader.onerror = ()=>{
      alert('Could not read the file.');
      if(label) label.textContent = oldLabel;
    };
    reader.readAsArrayBuffer(file);
  }

  function setTransportState(mode){
    document.getElementById('btnDemo').classList.toggle('active', mode==='demo');
    document.getElementById('btnPlay').classList.toggle('active', mode==='buffer');
  }

  // ---------------------------------------------------------------
  // Scope
  // ---------------------------------------------------------------
  function startScope(){
    const canvas = document.getElementById('scope');
    scopeCtx = canvas.getContext('2d');
    const data = new Uint8Array(analyser.fftSize);
    function draw(){
      animId = requestAnimationFrame(draw);
      analyser.getByteTimeDomainData(data);
      scopeCtx.clearRect(0,0,canvas.width,canvas.height);
      scopeCtx.beginPath();
      scopeCtx.strokeStyle = '#000000';
      scopeCtx.lineWidth = 1.6;
      scopeCtx.shadowBlur = 0;
      const sliceW = canvas.width/data.length;
      let x=0;
      for(let i=0;i<data.length;i++){
        const v = data[i]/128.0;
        const y = v*canvas.height/2;
        if(i===0) scopeCtx.moveTo(x,y); else scopeCtx.lineTo(x,y);
        x += sliceW;
      }
      scopeCtx.stroke();
    }
    draw();
  }

  // ---------------------------------------------------------------
  // UI: build pedal DOM, knobs, footswitches, drag reorder
  // ---------------------------------------------------------------
  const board = document.getElementById('board');

  function knobRotation(v,min,max){ return -135 + ((v-min)/(max-min))*270; }

  function makeKnob(param){
    const wrap = document.createElement('div');
    wrap.className = 'knob';
    wrap.innerHTML = '<div class="knob-dial"><div class="ind"></div></div><label>'+param.label+'</label><span class="val"></span>';
    const ind = wrap.querySelector('.ind');
    const valEl = wrap.querySelector('.val');
    let value = (typeof param.value === 'number') ? param.value : param.def;
    function render(){
      ind.style.transform = 'translateX(-50%) rotate('+knobRotation(value,param.min,param.max)+'deg)';
      valEl.textContent = Math.round(value);
    }
    render();

    let dragging=false, startY=0, startVal=0;
    function onDown(e){
      dragging=true; startY = (e.touches? e.touches[0].clientY : e.clientY); startVal=value;
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const y = (e.touches? e.touches[0].clientY : e.clientY);
      const delta = (startY - y);
      value = Math.min(param.max, Math.max(param.min, startVal + delta*(param.max-param.min)/140));
      param.value = value;
      render();
      param.onChange(value);
    }
    function onUp(){ dragging=false; }
    wrap.addEventListener('mousedown', onDown);
    wrap.addEventListener('touchstart', onDown, {passive:false});
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);

    param.setValue = function(v){
      value = Math.min(param.max, Math.max(param.min, v));
      param.value = value;
      render();
      param.onChange(value);
    };
    return wrap;
  }

  function renderBoard(){
    // clear existing pedal elements (keep svg)
    Array.from(board.querySelectorAll('.pedal')).forEach(el=>el.remove());
    ['tl','tr','bl','br'].forEach(pos=>{
      const r = document.createElement('div'); r.className='rivet '+pos; board.appendChild(r);
    });

    order.forEach((id, i)=>{
      const p = pedals[id];
      const def = p.def;
      const el = document.createElement('div');
      el.className = 'pedal' + (p.enabled?' on':'');
      el.style.setProperty('--pc-light', def.light);
      el.style.setProperty('--pc-dark', def.dark);
      el.draggable = false;
      el.dataset.id = id;

      const grip = document.createElement('div'); grip.className='grip'; el.appendChild(grip);
      const idx = document.createElement('div'); idx.className='idx'; idx.textContent = (i+1); el.appendChild(idx);
      const name = document.createElement('div'); name.className='name'; name.textContent = def.name; el.appendChild(name);

      const jackTop = document.createElement('div'); jackTop.className='jack'; el.appendChild(jackTop);

      const knobsWrap = document.createElement('div'); knobsWrap.className='knobs';
      p.params.forEach(param=>{ knobsWrap.appendChild(makeKnob(param)); });
      el.appendChild(knobsWrap);

      const sw = document.createElement('div'); sw.className='footswitch';
      sw.innerHTML = '<div class="led"></div>';
      sw.addEventListener('click', ()=>{
        ensureCtx();
        const live = pedals[id];
        setEnabled(id, !live.enabled);
      });
      el.appendChild(sw);

      // (reverse has no restrictions now that mic input is removed)

      // drag reorder (pointer-based, horizontal)
      grip.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        ensureCtx();
        el.classList.add('dragging');
        grip.setPointerCapture(e.pointerId);
        const onMove = (ev)=>{
          const rect = board.getBoundingClientRect();
          const x = ev.clientX;
          // find element under pointer among siblings
          const siblings = Array.from(board.querySelectorAll('.pedal'));
          let targetIdx = order.indexOf(id);
          for(let s=0;s<siblings.length;s++){
            const sr = siblings[s].getBoundingClientRect();
            if(x > sr.left && x < sr.right && siblings[s]!==el){
              targetIdx = order.indexOf(siblings[s].dataset.id);
            }
          }
          const curIdx = order.indexOf(id);
          if(targetIdx !== curIdx){
            order.splice(curIdx,1);
            order.splice(targetIdx,0,id);
            rebuildRouting();
            renderBoard();
          }
        };
        const onUp = (ev)=>{
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          const freshEl = board.querySelector('.pedal[data-id="'+id+'"]');
          if(freshEl) freshEl.classList.remove('dragging');
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });

      p.el = el;
      board.appendChild(el);
    });

    drawCables();
  }

  function drawCables(){
    const svg = document.getElementById('cables');
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const boardRect = board.getBoundingClientRect();
    const els = order.map(id=>pedals[id].el).filter(Boolean);
    for(let i=0;i<els.length-1;i++){
      const a = els[i].querySelector('.jack').getBoundingClientRect();
      const b = els[i+1].querySelector('.jack').getBoundingClientRect();
      const ax = a.left+a.width/2-boardRect.left, ay = a.top+a.height/2-boardRect.top;
      const bx = b.left+b.width/2-boardRect.left, by = b.top+b.height/2-boardRect.top;
      const midY = Math.max(ay,by) + 26;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', 'M'+ax+','+ay+' C '+ax+','+midY+' '+bx+','+midY+' '+bx+','+by);
      svg.appendChild(path);
    }
  }

  // ---------------------------------------------------------------
  // Transport wiring
  // ---------------------------------------------------------------
  document.getElementById('btnDemo').addEventListener('click', playDemoRiff);
  document.getElementById('btnPlay').addEventListener('click', ()=>{
    ensureCtx();
    if(!currentBuffer){ alert('Play the demo or load a file first.'); return; }
    restartBufferSource();
    setTransportState('buffer');
  });
  document.getElementById('btnStop').addEventListener('click', ()=>{ ensureCtx(); stopSource(); });
  document.getElementById('fileInput').addEventListener('change', (e)=>{
    if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
    e.target.value = ''; // reset so choosing the same file again still fires 'change'
  });

  // ---------------------------------------------------------------
  // Export: renders the current pedal chain fully offline (with the
  // last generated/set values) and offers the result directly as a
  // WAV file for download — no real-time recording, no timing needed.
  // ---------------------------------------------------------------
  const btnExport = document.getElementById('btnExport');

  function renderOfflineOutput(){
    return new Promise((resolve, reject)=>{
      if(!currentBuffer){ reject(new Error('no-buffer')); return; }
      const srcBuf = reversedFlag ? reverseBuffer(currentBuffer) : currentBuffer;
      const off = new OfflineAudioContext(srcBuf.numberOfChannels, srcBuf.length, ctx.sampleRate);
      const liveCtx = ctx;
      ctx = off; // pedal build functions reference the module-level `ctx`
      try{
        const offlinePedals = {};
        PEDAL_DEFS.forEach(def=>{
          const built = BUILDERS[def.id]();
          offlinePedals[def.id] = built;
          const liveP = pedals[def.id];
          built.params.forEach(param=>{
            const liveParam = liveP ? liveP.params.find(lp=>lp.key===param.key) : null;
            const apply = param.onChangeImmediate || param.onChange;
            apply(liveParam ? liveParam.value : param.def);
          });
          const on = liveP ? liveP.enabled : true;
          if(def.bypassMode === 'swap'){
            built.shell.dry.gain.value = on?0:1;
            built.shell.wet.gain.value = on?1:0;
          } else if(def.bypassMode === 'add'){
            built.shell.dry.gain.value = 1;
            built.shell.wet.gain.value = on?1:0;
          }
        });
        order.forEach((id,i)=>{
          if(i>0) offlinePedals[order[i-1]].shell.output.connect(offlinePedals[id].shell.input);
        });
        offlinePedals[order[order.length-1]].shell.output.connect(off.destination);
        const srcNode = off.createBufferSource();
        srcNode.buffer = srcBuf;
        srcNode.connect(offlinePedals[order[0]].shell.input);
        srcNode.start();
        ctx = liveCtx; // Knoten sind gebaut & verbunden; ab hier braucht startRendering() die Modul-Variable nicht mehr
        off.startRendering().then(rendered=>{
          resolve(rendered);
        }).catch(reject);
      }catch(err){
        ctx = liveCtx;
        reject(err);
      }
    });
  }

  function audioBufferToWav(buffer){
    const numCh = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const frames = buffer.length;
    const dataSize = frames*numCh*2;
    const arrBuf = new ArrayBuffer(44+dataSize);
    const view = new DataView(arrBuf);
    function writeStr(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }
    writeStr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
    view.setUint32(28, sampleRate*numCh*2, true); view.setUint16(32, numCh*2, true); view.setUint16(34,16,true);
    writeStr(36,'data'); view.setUint32(40, dataSize, true);
    const channels = []; for(let ch=0; ch<numCh; ch++) channels.push(buffer.getChannelData(ch));
    let offset = 44;
    for(let i=0;i<frames;i++){
      for(let ch=0; ch<numCh; ch++){
        let s = Math.max(-1, Math.min(1, channels[ch][i]));
        s = s<0 ? s*0x8000 : s*0x7FFF;
        view.setInt16(offset, s, true);
        offset += 2;
      }
    }
    return new Blob([view], {type:'audio/wav'});
  }

  async function doExport(){
    ensureCtx();
    if(!currentBuffer){
      alert('Play the demo or load a file first.');
      return;
    }
    btnExport.disabled = true;
    const oldLabel = btnExport.textContent;
    btnExport.textContent = '… rendering';
    try{
      const rendered = await renderOfflineOutput();
      const blob = audioBufferToWav(rendered);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'tape-reflex-export.wav';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }catch(err){
      console.error(err);
      alert('Export failed.');
    }finally{
      btnExport.disabled = false;
      btnExport.textContent = oldLabel;
    }
  }
  btnExport.addEventListener('click', doExport);

  // ---------------------------------------------------------------
  // Pedal selectors + Generate
  // Clicking a level only sets the selection (like a control preset,
  // no sound yet). Only "Generate" rolls a random number within the
  // chosen level for each pedal (incl. on/off).
  // ---------------------------------------------------------------
  const macrosWrap = document.getElementById('macros');

  function renderPedalSelectors(){
    PEDAL_DEFS.forEach(def=>{
      const row = document.createElement('div'); row.className='macro-row';
      const label = document.createElement('div'); label.className='macro-label';
      label.innerHTML = '<span class="name">'+def.name+'</span>' + (def.desc ? '<span class="desc">'+def.desc+'</span>' : '');
      const seg = document.createElement('div'); seg.className='segmented';
      LEVELS.forEach(lv=>{
        const b = document.createElement('button');
        b.textContent = LEVEL_LABEL[lv];
        b.className = (pedalState[def.id]===lv) ? 'active' : '';
        b.addEventListener('click', ()=>{
          pedalState[def.id] = lv;
          Array.from(seg.children).forEach(c=>c.classList.remove('active'));
          b.classList.add('active');
        });
        seg.appendChild(b);
      });
      row.appendChild(label); row.appendChild(seg);
      macrosWrap.appendChild(row);
    });
  }
  renderPedalSelectors();

  function randRange(r){ return r[0] + Math.random()*(r[1]-r[0]); }

  function generate(){
    ensureCtx();
    PEDAL_DEFS.forEach(def=>{
      const pedId = def.id;
      const level = pedalState[pedId];
      const spec = PEDAL_SPECS[pedId][level];
      const p = pedals[pedId];
      const on = Math.random() < spec.on;
      setEnabled(pedId, on);
      p.params.forEach(param=>{
        const range = spec[param.key];
        if(range && param.setValue) param.setValue(randRange(range));
      });
    });
    const summary = PEDAL_DEFS.map(def=>def.name+': '+LEVEL_LABEL[pedalState[def.id]]).join(' · ');
    document.getElementById('vibesHint').textContent = summary + ' — press again for a new variation within these levels.';
  }
  document.getElementById('btnGenerate').addEventListener('click', generate);

  // Expert mode disabled: toggle stays in the DOM (disabled, hidden),
  // pedal chain stays in the code but is no longer reachable via the UI.
  // document.getElementById('expertToggle').addEventListener('change', (e)=>{
  //   document.getElementById('boardWrap').classList.toggle('open', e.target.checked);
  // });

  // master knob
  (function(){
    const wrap = document.getElementById('masterKnob');
    const ind = wrap.querySelector('.ind');
    let value = 85, dragging=false, startY=0, startVal=0;
    function render(){ ind.style.transform='translateX(-50%) rotate('+knobRotation(value,0,100)+'deg)'; }
    render();
    function onDown(e){ dragging=true; startY=(e.touches?e.touches[0].clientY:e.clientY); startVal=value; e.preventDefault(); }
    function onMove(e){
      if(!dragging) return;
      const y=(e.touches?e.touches[0].clientY:e.clientY);
      value = Math.min(100, Math.max(0, startVal + (startY-y)*100/140));
      render();
      if(masterGain) masterGain.gain.setTargetAtTime(value/100, ctx.currentTime, 0.02);
    }
    function onUp(){ dragging=false; }
    wrap.addEventListener('mousedown', onDown);
    wrap.addEventListener('touchstart', onDown, {passive:false});
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
  })();

  // initial render (pre-audio-context) so the board is visible immediately
  function renderPlaceholderBoard(){
    order.forEach((id,i)=>{
      const def = PEDAL_DEFS.find(d=>d.id===id);
      pedals[id] = pedals[id] || {def, params:[], enabled: false, isReverse:id==='rev'};
    });
    renderBoard();
  }
  renderPlaceholderBoard();

  window.addEventListener('resize', ()=>{ if(ctx) drawCables(); });

  // ---------------------------------------------------------------
  // Keep the panel below (and the export bar) the same width as the
  // transport bar, so all boxes share the same x-extent and stay
  // centered together.
  // ---------------------------------------------------------------
  function syncPanelWidths(){
    const ref = document.querySelector('.transport');
    if(!ref) return;
    const w = ref.getBoundingClientRect().width;
    if(!w) return;
    document.querySelectorAll('.vibes-panel, .export-bar').forEach(el=>{
      el.style.width = w+'px';
    });
  }
  window.addEventListener('resize', syncPanelWidths);
  window.addEventListener('load', syncPanelWidths);
  setTimeout(syncPanelWidths, 0);
  setTimeout(syncPanelWidths, 300);
})();

// ---------------------------------------------------------------
// Intro sequence: play the logo animation, fade it out, then fade
// the rest of the page in.
// ---------------------------------------------------------------
(function(){
  const overlay = document.getElementById('introOverlay');
  const video = document.getElementById('introVideo');
  const content = document.getElementById('pageContent');
  let started = false;

  function startReveal(){
    if(started) return;
    started = true;
    overlay.classList.add('hide');
    content.classList.add('show');
    setTimeout(()=>{ overlay.remove(); }, 1200);
  }

  if(video){
    video.addEventListener('ended', startReveal);
    // fallback in case autoplay is blocked or 'ended' never fires
    video.addEventListener('error', startReveal);
    setTimeout(startReveal, 4500);
  } else {
    startReveal();
  }
})();
</script>
</div>
